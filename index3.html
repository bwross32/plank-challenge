<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plank 30">
  <link rel="manifest" href="manifest.json">
  <title>30-Day Plank Challenge</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f4f4f5;
      --subtext: #a1a1aa;
      --border: #27272a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 500px; margin: 0 auto; min-height: 100vh; position: relative; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; }
    .subtitle { color: var(--subtext); font-size: 13px; margin-top: 2px; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    
    .timer-display { font-size: 56px; font-weight: 800; text-align: center; margin: 12px 0; font-mono: monospace; letter-spacing: -1px; }
    .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    button { background: var(--accent); color: white; border: none; border-radius: 12px; padding: 12px 18px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; }
    button:active { transform: scale(0.98); }
    button.secondary { background: #27272a; color: var(--text); }
    button.success { background: var(--success); }
    button.danger { background: var(--danger); }
    button.outline-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 6px 12px; font-size: 12px; border-radius: 8px; }
    
    .reminder-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    input[type="time"] { background: #27272a; border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 8px; font-size: 16px; }
    
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
    .day-card { background: #27272a; border-radius: 12px; padding: 12px; border: 1px solid transparent; cursor: pointer; }
    .day-card.active { border-color: var(--accent); background: #1e293b; }
    .day-card.completed { border-color: var(--success); }
    .day-card.rest { border-color: var(--warning); opacity: 0.8; }
    .day-num { font-size: 12px; color: var(--subtext); font-weight: 600; }
    .day-target { font-size: 18px; font-weight: 700; margin-top: 2px; }

    /* Modal Overlay and Medallion Styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    
    .modal-card {
      background: #18181b; border: 2px solid var(--accent); border-radius: 24px;
      padding: 24px; width: 90%; max-width: 380px; text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5); transform: scale(0.8); transition: transform 0.3s ease;
    }
    .modal-overlay.open .modal-card { transform: scale(1); }

    .medallion-container {
      width: 160px; height: 160px; margin: 16px auto; position: relative;
      background: radial-gradient(circle, #fbbf24 0%, #d97706 70%, #78350f 100%);
      border-radius: 50%; border: 6px solid #fef08a;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.5), inset 0 0 15px rgba(0, 0, 0, 0.4);
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>30-Day Plank Challenge</h1>
      <p class="subtitle" id="currentDateStr"></p>
    </div>
    <button class="outline-danger" onclick="promptResetChallenge()">Reset All</button>
  </header>

  <div class="card">
    <div style="display:flex; justify-content: space-between; align-items:center;">
      <span id="activeDayTitle" style="font-weight:700; font-size:18px;">Day 1</span>
      <span id="activeDayBadge" style="background:#2563eb; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:600;">Active</span>
    </div>
    
    <div class="timer-display" id="timerDisplay">00:20</div>
    
    <div class="controls">
      <button id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="secondary" onclick="resetTimer()">Reset</button>
      <button class="secondary" onclick="playChime()">Test Sound 🔔</button>
      <button class="success" id="completeBtn" onclick="toggleComplete()">Complete</button>
    </div>
  </div>

  <div class="card">
    <div class="reminder-box">
      <div>
        <div style="font-weight:600; font-size:14px;">Daily Reminder</div>
        <div style="font-size:12px; color:var(--subtext);">Set reminder time</div>
      </div>
      <input type="time" id="reminderTime" value="09:00" onchange="saveReminder()">
      <button class="secondary" style="padding:8px 12px; font-size:12px;" onclick="requestNotify()">Enable Alerts</button>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:700; margin-bottom:12px;">30-Day Schedule</div>
    <div class="grid" id="scheduleGrid"></div>
  </div>

  <!-- Milestone Celebration Modal Popup -->
  <div class="modal-overlay" id="milestoneModal">
    <div class="modal-card">
      <h2 style="font-size: 22px; color: #fef08a;" id="modalTitle">MILESTONE UNLOCKED!</h2>
      <p style="font-size: 14px; color: #a1a1aa; margin-top: 4px;" id="modalSubtitle">You completed 5 days!</p>
      
      <div class="medallion-container">
        <svg id="characterSvg" width="120" height="120" viewBox="0 0 100 100">
          <circle cx="50" cy="22" r="10" fill="#fde047" />
          <path d="M 46 24 Q 50 28 54 24" stroke="#78350f" stroke-width="1.5" fill="none" />
          <circle cx="46" cy="20" r="1" fill="#78350f" />
          <circle cx="54" cy="20" r="1" fill="#78350f" />
          <path d="M 38 34 L 62 34 L 58 75 L 42 75 Z" fill="#fde047" stroke="#78350f" stroke-width="1.5" />
          <path d="M 38 36 Q 24 30 26 18 Q 32 18 36 28" fill="#fde047" stroke="#78350f" stroke-width="1.5" />
          <path d="M 62 36 Q 76 30 74 18 Q 68 18 64 28" fill="#fde047" stroke="#78350f" stroke-width="1.5" />
          <g id="abGroup" stroke="#78350f" stroke-width="1.5" fill="none"></g>
        </svg>
      </div>

      <p style="font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #f4f4f5;" id="modalDesc">You earned 1 of your 6-pack abs!</p>
      <button class="success" style="width: 100%; padding: 12px;" onclick="closeModal()">Keep It Up! 🔥</button>
    </div>
  </div>

  <!-- Reset Confirmation Modal -->
  <div class="modal-overlay" id="resetModal">
    <div class="modal-card" style="border-color: var(--danger);">
      <h2 style="font-size: 20px; color: #fca5a5;">Reset Challenge?</h2>
      <p style="font-size: 14px; color: #a1a1aa; margin: 12px 0 20px;">This will erase all completed days and reset your progress back to Day 1. This action cannot be undone.</p>
      <div style="display: flex; gap: 8px;">
        <button class="secondary" style="flex: 1;" onclick="closeResetModal()">Cancel</button>
        <button class="danger" style="flex: 1;" onclick="confirmResetChallenge()">Yes, Reset</button>
      </div>
    </div>
  </div>

  <script>
    
    if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
    
    const plan = [
      20, 20, 30, 30, 40, 0,
      45, 45, 60, 60, 90, 0,
      90, 100, 120, 120, 150, 0,
      150, 180, 180, 210, 240, 0,
      240, 270, 270, 300, 300, 300
    ];

    let currentDayIndex = 0;
    let timer = null;
    let timeLeft = plan[0];
    let isRunning = false;
    let completedDays = JSON.parse(localStorage.getItem('plank_completed') || '[]');
    let audioCtx = null;
      
    const chimeAudio = new Audio("data:audio/wav;base64,UklGRl9vAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVBvAAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////");

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function unlockAudio() {
      getAudioContext();
      chimeAudio.play().then(() => {
        chimeAudio.pause();
        chimeAudio.currentTime = 0;
      }).catch(() => {});
      document.removeEventListener('touchstart', unlockAudio);
      document.removeEventListener('click', unlockAudio);
    }
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    function init() {
      const today = new Date();
      document.getElementById('currentDateStr').innerText = today.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
      renderGrid();
      loadDay(0);
    }

    function formatTime(sec) {
      if (sec === 0) return "REST DAY";
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m > 0 ? m + 'm ' : ''}${s}s`;
    }

    function formatTimerDisplay(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function renderGrid() {
      const container = document.getElementById('scheduleGrid');
      container.innerHTML = '';
      const startDate = new Date();

      plan.forEach((targetSec, idx) => {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + idx);
        const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        const isCompleted = completedDays.includes(idx);
        const isRest = targetSec === 0;
        const isActive = idx === currentDayIndex;

        const card = document.createElement('div');
        card.className = `day-card ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''} ${isRest ? 'rest' : ''}`;
        card.onclick = () => loadDay(idx);
        card.innerHTML = `
          <div class="day-num">DAY ${idx + 1} • ${dateStr}</div>
          <div class="day-target">${isRest ? 'REST' : formatTime(targetSec)}</div>
        `;
        container.appendChild(card);
      });
    }

    function loadDay(idx) {
      currentDayIndex = idx;
      resetTimer();
      const targetSec = plan[idx];
      document.getElementById('activeDayTitle').innerText = `Day ${idx + 1}`;
      document.getElementById('activeDayBadge').innerText = targetSec === 0 ? 'Rest Day' : formatTime(targetSec);
      document.getElementById('activeDayBadge').style.background = targetSec === 0 ? 'var(--warning)' : 'var(--accent)';
      document.getElementById('completeBtn').innerText = completedDays.includes(idx) ? 'Completed ✓' : 'Complete';
      renderGrid();
    }

    function toggleTimer() {
      if (plan[currentDayIndex] === 0) return;
      getAudioContext();

      if (isRunning) {
        clearInterval(timer);
        document.getElementById('startBtn').innerText = 'Start';
      } else {
        timer = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            document.getElementById('timerDisplay').innerText = formatTimerDisplay(timeLeft);
          } else {
            clearInterval(timer);
            playChime();
            toggleComplete(true);
            document.getElementById('startBtn').innerText = 'Start';
          }
        }, 1000);
        document.getElementById('startBtn').innerText = 'Pause';
      }
      isRunning = !isRunning;
    }

    function resetTimer() {
      clearInterval(timer);
      isRunning = false;
      timeLeft = plan[currentDayIndex];
      document.getElementById('timerDisplay').innerText = formatTimerDisplay(timeLeft);
      document.getElementById('startBtn').innerText = 'Start';
    }

    function toggleComplete(forceTrue = false) {
      const wasCompleted = completedDays.includes(currentDayIndex);
      
      if (forceTrue && !wasCompleted) {
        completedDays.push(currentDayIndex);
      } else if (!forceTrue) {
        if (wasCompleted) {
          completedDays = completedDays.filter(d => d !== currentDayIndex);
        } else {
          completedDays.push(currentDayIndex);
        }
      }
      localStorage.setItem('plank_completed', JSON.stringify(completedDays));
      
      if (!wasCompleted && completedDays.includes(currentDayIndex)) {
        checkMilestone(completedDays.length);
      }
      
      loadDay(currentDayIndex);
    }

    function checkMilestone(totalCompleted) {
      const milestones = [5, 10, 15, 20, 25, 30];
      if (milestones.includes(totalCompleted)) {
        showMilestoneModal(totalCompleted);
      }
    }

    function showMilestoneModal(count) {
      const abCount = Math.min(Math.floor(count / 5), 6);
      const abGroup = document.getElementById('abGroup');
      abGroup.innerHTML = '';

      const abs = [
        '<rect x="42" y="42" width="7" height="6" rx="2" />',
        '<rect x="51" y="42" width="7" height="6" rx="2" />',
        '<rect x="42" y="50" width="7" height="6" rx="2" />',
        '<rect x="51" y="50" width="7" height="6" rx="2" />',
        '<rect x="42" y="58" width="7" height="6" rx="2" />',
        '<rect x="51" y="58" width="7" height="6" rx="2" />'
      ];

      for (let i = 0; i < abCount; i++) {
        abGroup.innerHTML += abs[i];
      }

      if (count === 30) {
        document.getElementById('modalTitle').innerText = '🏆 CHALLENGE COMPLETE! 🏆';
        document.getElementById('modalSubtitle').innerText = 'All 30 Days Accomplished!';
        document.getElementById('modalDesc').innerText = 'CONGRATULATIONS! You unlocked full 6-Pack Abs!';
      } else {
        document.getElementById('modalTitle').innerText = 'MILESTONE UNLOCKED!';
        document.getElementById('modalSubtitle').innerText = `You completed ${count} days!`;
        document.getElementById('modalDesc').innerText = `Awesome! You earned ${abCount} of your 6-pack abs!`;
      }

      document.getElementById('milestoneModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('milestoneModal').classList.remove('open');
    }

    function promptResetChallenge() {
      document.getElementById('resetModal').classList.add('open');
    }

    function closeResetModal() {
      document.getElementById('resetModal').classList.remove('open');
    }

    function confirmResetChallenge() {
      completedDays = [];
      localStorage.removeItem('plank_completed');
      closeResetModal();
      loadDay(0);
    }

    function playChime() {
      try {
        const ctx = getAudioContext();
        if (ctx && ctx.state === 'running') {
          const now = ctx.currentTime;
          
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now);
          gain1.gain.setValueAtTime(0.5, now);
          gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.8);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.2);
          gain2.gain.setValueAtTime(0.5, now + 0.2);
          gain2.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.2);
          osc2.stop(now + 1.2);
        } else {
          chimeAudio.currentTime = 0;
          chimeAudio.play();
        }
      } catch(e) {
        chimeAudio.currentTime = 0;
        chimeAudio.play();
      }
    }

    function requestNotify() {
      if ('Notification' in window) {
        Notification.requestPermission().then(p => {
          alert(p === 'granted' ? 'Notifications enabled!' : 'Notification access denied.');
        });
      } else {
        alert('Web Notifications are only supported when saved to Home Screen on iOS 16.4+');
      }
    }

    function saveReminder() {
      localStorage.setItem('plank_reminder_time', document.getElementById('reminderTime').value);
    }

    init();
  </script>
</body>
</html>
