<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plank 30">
  <title>30-Day Plank Challenge</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f4f4f5;
      --subtext: #a1a1aa;
      --border: #27272a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 500px; margin: 0 auto; min-height: 100vh; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 700; }
    .subtitle { color: var(--subtext); font-size: 14px; margin-top: 4px; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    
    .timer-display { font-size: 56px; font-weight: 800; text-align: center; margin: 12px 0; font-mono: monospace; letter-spacing: -1px; }
    .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    button { background: var(--accent); color: white; border: none; border-radius: 12px; padding: 12px 18px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; }
    button:active { transform: scale(0.98); }
    button.secondary { background: #27272a; color: var(--text); }
    button.success { background: var(--success); }
    
    .reminder-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    input[type="time"] { background: #27272a; border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 8px; font-size: 16px; }
    
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 12px; }
    .day-card { background: #27272a; border-radius: 12px; padding: 12px; border: 1px solid transparent; cursor: pointer; }
    .day-card.active { border-color: var(--accent); background: #1e293b; }
    .day-card.completed { border-color: var(--success); }
    .day-card.rest { border-color: var(--warning); opacity: 0.8; }
    .day-num { font-size: 12px; color: var(--subtext); font-weight: 600; }
    .day-target { font-size: 18px; font-weight: 700; margin-top: 2px; }
  </style>
</head>
<body>

  <header>
    <h1>30-Day Plank Challenge</h1>
    <p class="subtitle" id="currentDateStr"></p>
  </header>

  <div class="card">
    <div style="display:flex; justify-content: space-between; align-items:center;">
      <span id="activeDayTitle" style="font-weight:700; font-size:18px;">Day 1</span>
      <span id="activeDayBadge" style="background:#2563eb; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:600;">Active</span>
    </div>
    
    <div class="timer-display" id="timerDisplay">00:20</div>
    
    <div class="controls">
      <button id="startBtn" onclick="toggleTimer()">Start</button>
      <button class="secondary" onclick="resetTimer()">Reset</button>
      <button class="secondary" onclick="playChime()">Test Sound 🔔</button>
      <button class="success" id="completeBtn" onclick="toggleComplete()">Complete</button>
    </div>
  </div>

  <div class="card">
    <div class="reminder-box">
      <div>
        <div style="font-weight:600; font-size:14px;">Daily Reminder</div>
        <div style="font-size:12px; color:var(--subtext);">Set reminder time</div>
      </div>
      <input type="time" id="reminderTime" value="09:00" onchange="saveReminder()">
      <button class="secondary" style="padding:8px 12px; font-size:12px;" onclick="requestNotify()">Enable Alerts</button>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:700; margin-bottom:12px;">30-Day Schedule</div>
    <div class="grid" id="scheduleGrid"></div>
  </div>

  <script>
    const plan = [
      20, 20, 30, 30, 40, 0,
      45, 45, 60, 60, 90, 0,
      90, 100, 120, 120, 150, 0,
      150, 180, 180, 210, 240, 0,
      240, 270, 270, 300, 300, 300
    ];

    let currentDayIndex = 0;
    let timer = null;
    let timeLeft = plan[0];
    let isRunning = false;
    let completedDays = JSON.parse(localStorage.getItem('plank_completed') || '[]');
    let audioCtx = null;

    // Embedded chime audio fallback for iOS Safari compatibility
    const chimeAudio = new Audio("data:audio/wav;base64,UklGRl9vAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVBvAAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////AAD/////");

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Touch listener to prime audio playback engines on iOS
    function unlockAudio() {
      getAudioContext();
      chimeAudio.play().then(() => {
        chimeAudio.pause();
        chimeAudio.currentTime = 0;
      }).catch(() => {});
      document.removeEventListener('touchstart', unlockAudio);
      document.removeEventListener('click', unlockAudio);
    }
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    function init() {
      const today = new Date();
      document.getElementById('currentDateStr').innerText = today.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
      renderGrid();
      loadDay(0);
    }

    function formatTime(sec) {
      if (sec === 0) return "REST DAY";
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m > 0 ? m + 'm ' : ''}${s}s`;
    }

    function formatTimerDisplay(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function renderGrid() {
      const container = document.getElementById('scheduleGrid');
      container.innerHTML = '';
      const startDate = new Date();

      plan.forEach((targetSec, idx) => {
        const date = new Date(startDate);
        date.setDate(startDate.getDate() + idx);
        const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

        const isCompleted = completedDays.includes(idx);
        const isRest = targetSec === 0;
        const isActive = idx === currentDayIndex;

        const card = document.createElement('div');
        card.className = `day-card ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''} ${isRest ? 'rest' : ''}`;
        card.onclick = () => loadDay(idx);
        card.innerHTML = `
          <div class="day-num">DAY ${idx + 1} • ${dateStr}</div>
          <div class="day-target">${isRest ? 'REST' : formatTime(targetSec)}</div>
        `;
        container.appendChild(card);
      });
    }

    function loadDay(idx) {
      currentDayIndex = idx;
      resetTimer();
      const targetSec = plan[idx];
      document.getElementById('activeDayTitle').innerText = `Day ${idx + 1}`;
      document.getElementById('activeDayBadge').innerText = targetSec === 0 ? 'Rest Day' : formatTime(targetSec);
      document.getElementById('activeDayBadge').style.background = targetSec === 0 ? 'var(--warning)' : 'var(--accent)';
      document.getElementById('completeBtn').innerText = completedDays.includes(idx) ? 'Completed ✓' : 'Complete';
      renderGrid();
    }

    function toggleTimer() {
      if (plan[currentDayIndex] === 0) return;
      getAudioContext();

      if (isRunning) {
        clearInterval(timer);
        document.getElementById('startBtn').innerText = 'Start';
      } else {
        timer = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            document.getElementById('timerDisplay').innerText = formatTimerDisplay(timeLeft);
          } else {
            clearInterval(timer);
            playChime();
            toggleComplete(true);
            document.getElementById('startBtn').innerText = 'Start';
          }
        }, 1000);
        document.getElementById('startBtn').innerText = 'Pause';
      }
      isRunning = !isRunning;
    }

    function resetTimer() {
      clearInterval(timer);
      isRunning = false;
      timeLeft = plan[currentDayIndex];
      document.getElementById('timerDisplay').innerText = formatTimerDisplay(timeLeft);
      document.getElementById('startBtn').innerText = 'Start';
    }

    function toggleComplete(forceTrue = false) {
      if (forceTrue && !completedDays.includes(currentDayIndex)) {
        completedDays.push(currentDayIndex);
      } else if (!forceTrue) {
        if (completedDays.includes(currentDayIndex)) {
          completedDays = completedDays.filter(d => d !== currentDayIndex);
        } else {
          completedDays.push(currentDayIndex);
        }
      }
      localStorage.setItem('plank_completed', JSON.stringify(completedDays));
      loadDay(currentDayIndex);
    }

    function playChime() {
      try {
        const ctx = getAudioContext();
        if (ctx && ctx.state === 'running') {
          const now = ctx.currentTime;
          
          const osc1 = ctx.createOscillator();
          const gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(587.33, now);
          gain1.gain.setValueAtTime(0.5, now);
          gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(now);
          osc1.stop(now + 0.8);

          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880, now + 0.2);
          gain2.gain.setValueAtTime(0.5, now + 0.2);
          gain2.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(now + 0.2);
          osc2.stop(now + 1.2);
        } else {
          chimeAudio.currentTime = 0;
          chimeAudio.play();
        }
      } catch(e) {
        chimeAudio.currentTime = 0;
        chimeAudio.play();
      }
    }

    function requestNotify() {
      if ('Notification' in window) {
        Notification.requestPermission().then(p => {
          alert(p === 'granted' ? 'Notifications enabled!' : 'Notification access denied.');
        });
      } else {
        alert('Web Notifications are only supported when saved to Home Screen on iOS 16.4+');
      }
    }

    function saveReminder() {
      localStorage.setItem('plank_reminder_time', document.getElementById('reminderTime').value);
    }

    init();
  </script>
</body>
</html>
